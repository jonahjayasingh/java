<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Job</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>Add a New Job</h1>

        <form th:action="@{/addjob}" method="post" class="job-form">
            <div class="form-group">
                <label for="jobName">Job Name</label>
                <input type="text" name="jobName" id="jobName" required>
            </div>

            <div class="form-group">
                <label for="jobDescription">Job Description</label>
                <input type="text" name="jobDescription" id="jobDescription" required>
            </div>

            <div class="form-group">
                <label for="tech">Tech Stack</label>
                <select name="tech" id="tech" multiple>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="mern">MERN</option>
                    <option value="php">PHP</option>
                </select>
                <small class="hint">Hold Ctrl (Cmd on Mac) to select multiple</small>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <a th:href="@{/}" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
