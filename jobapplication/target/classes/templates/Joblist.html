<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container wide">
        <h1>Job List</h1>

        <div class="job-list" th:if="${not #lists.isEmpty(jobs)}">
            <div class="job-card" th:each="job : ${jobs}">
                <div class="job-card-header">
                    <h2 th:text="${job.jobName}"></h2>
                </div>
                <p class="job-description" th:text="${job.jobDescription}"></p>
                <ul class="tech-list">
                    <li th:each="t : ${job.tech}" th:text="${t}"></li>
                </ul>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(jobs)}" class="empty-state">No jobs added yet.</p>

        <a th:href="@{/}" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
